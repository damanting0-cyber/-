<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음악 감상 수행평가</title>
<style>
  :root{--bg:#1f0029;--panel:#2d1536;--ink:#1c0523;--sub:#7d6e86;--accent:#22002b;--line:#ebe4ee;--out:cubic-bezier(.22,1,.36,1)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0 auto;max-width:520px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;min-height:100vh;padding:12px 10px 60px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-weight:700}
  button,input{font-family:inherit}
  button:focus{outline:none}
  h1{margin:0;font-size:16px;line-height:1;font-weight:900;letter-spacing:-.02em}
  .card{background:#fff;border-radius:999px;height:38px;padding:0 16px;display:flex;align-items:center}
  .head .sub{font-size:12px;color:var(--sub);margin-top:4px}
  /* 탭 + 구독 버튼 한 줄 */
  .head{position:sticky;top:8px;z-index:20;margin:0 0 12px;padding:8px;border-radius:26px;background:rgba(31,0,41,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .tabRow{display:flex;align-items:center;gap:6px;margin:8px 0 0}
  .volRow{flex:1;min-width:0;display:flex;align-items:center;padding:0 8px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:38px;margin:0;background:transparent;cursor:pointer;touch-action:none}
  input[type=range]:focus{outline:none}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,#f1e8f5 var(--p),rgba(255,255,255,.2) var(--p))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-4px;border-radius:50%;background:#f1e8f5;border:0;transition:transform .3s var(--out)}
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
  input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,255,255,.2)}
  input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:#f1e8f5}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#f1e8f5}
  .navFrame{flex:0 0 auto;padding:4px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}
  .nav{position:relative;display:flex;gap:6px;flex:0 0 auto}
  .nav .pill{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:999px;background:#fff;transition:left .5s var(--out),width .5s var(--out)}
  .nav button{position:relative;z-index:1;height:38px;padding:0 20px;border:0;border-radius:999px;background:transparent;color:#f1e8f5;font-size:15px;font-weight:800;cursor:pointer;transition:color .4s var(--out),background-color .4s var(--out),transform .25s var(--out)}
  .nav button.on{background:transparent;color:var(--ink)}
  .nav button:active{transform:scale(.96)}
  .ytBtn{flex:1;min-width:0;height:38px;display:flex;align-items:center;justify-content:flex-end;padding:0 16px;border-radius:999px;text-decoration:none;color:var(--ink);font-size:15px;font-weight:900;white-space:nowrap;position:relative;overflow:hidden;background-image:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,226,242,.9) 55%,#ffc4e4 100%),var(--pet,none);background-size:auto,cover;background-position:0 0,center 38%;background-repeat:no-repeat;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .25s var(--out)}
  .ytBtn:active{transform:scale(.97)}
  .ytBtn span{position:relative;z-index:1}
  .ytBtn svg{position:relative;z-index:1;flex-shrink:0;margin-left:8px}
  .ytBtn::before{content:"";position:absolute;top:0;bottom:0;left:0;right:0;z-index:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.7) 50%,transparent 65%);transform:translate3d(-100%,0,0);backface-visibility:hidden;will-change:transform;animation:shine 6s linear infinite;pointer-events:none}
  @keyframes shine{
    0%{transform:translate3d(-120%,0,0)}
    100%{transform:translate3d(120%,0,0)}
  }
  /* 화면 전환: 블러가 풀리며 ease-out으로 */
  .screen{display:none}
  .screen.active{display:block;animation:rise .6s var(--out) both}
  @keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
  @keyframes riseSoft{from{opacity:0;transform:translateY(10px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
  @keyframes fadeIn{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:blur(0)}}
  @keyframes qIn{from{opacity:0;transform:translateY(20px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
  @keyframes spinRot{to{transform:rotate(360deg)}}
  /* 시대별 카드 */
  .section{margin:0 0 12px}
  .section.eraCard{background:var(--panel);border-radius:34px;padding:12px 10px;animation:riseSoft .7s var(--out) both}
  #list .eraCard:nth-child(2){animation-delay:.08s}
  #list .eraCard:nth-child(3){animation-delay:.16s}
  .section h2{margin:2px 14px 10px;font-size:14px;font-weight:800;color:#d8c8e2}
  /* 곡 카드 */
  .track{background:#fff;border-radius:26px;margin-bottom:8px;overflow:hidden;transition:box-shadow .5s var(--out)}
  .track:last-child{margin-bottom:0}
  .track.open{box-shadow:0 10px 24px rgba(0,0,0,.25)}
  .tHead{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;transition:background-color .3s var(--out)}
  .tHead:active{background:#f7f2f9}
  .num{position:relative;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .3s var(--out)}
  .num svg{width:12px;height:12px;display:none}
  .num .iconPlay{display:block;margin-left:1px}
  .track.isPlaying .num .iconPlay{display:none}
  .track.isPlaying .num .iconPause{display:block}
  .track.open .num:active{transform:scale(.9)}
  .num .n{display:none}
  .meta{flex:1;min-width:0;font-size:15px;font-weight:700;color:var(--ink);line-height:1.35}
  .eq{display:none}
  .spin{display:none;width:14px;height:14px;border-radius:50%;border:2px solid #e6dcec;border-top-color:var(--accent);box-sizing:border-box;flex-shrink:0}
  .track.loading .spin{display:block;animation:spinRot .8s linear infinite}
  .tBody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--out)}
  .track.open .tBody{grid-template-rows:1fr}
  .tInner{min-height:0;overflow:hidden}
  .pad{padding:0 12px 14px;opacity:0;filter:blur(6px);transform:translateY(-6px);transition:opacity .35s var(--out),filter .45s var(--out),transform .5s var(--out)}
  .track.open .pad{opacity:1;filter:blur(0);transform:none;transition-delay:.06s}
  .bar{position:relative;height:6px;border-radius:3px;background:var(--line);overflow:hidden;cursor:pointer;touch-action:none}
  .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:3px;transition:width .3s linear}
  .bar.drag .fill{transition:none}
  .pTimes{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:8px;font-variant-numeric:tabular-nums;font-weight:700}
  .missWrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--out)}
  .missWrap.show{grid-template-rows:1fr;margin-top:8px}
  .missing{min-height:0;overflow:hidden;font-size:12px;color:#c0392b}
  /* 시험 카드 (시대 카드와 같은 톤) */
  .qcard{background:var(--panel);border-radius:36px;padding:12px;margin-bottom:12px;overflow:hidden}
  .qcard.anim{animation:qIn .8s var(--out) both}
  .qcard.enter{animation:qIn .8s var(--out) both}
  .qcard.done{padding:10px 12px}
  .qTitle{font-size:14px;font-weight:800;color:#d8c8e2;margin:2px 14px 10px}
  .playRow{display:flex;gap:8px;margin-bottom:10px}
  .playRow .btn.play{width:auto;height:40px;margin:0;padding:0 16px;border-radius:999px;background:#fff;color:var(--ink);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;flex:0 0 auto;transition:background-color .3s var(--out),transform .25s var(--out)}
  .playRow .btn.play.isPlaying{background:var(--accent);color:#fff}
  .playRow .btn.play.isPlaying .qCurTxt{color:#fff}
  .btn.play .pl{display:flex}
  .btn.play .pl svg{width:16px;height:16px;display:block}
  .btn.play .eq2{display:none}
  .qCurTxt{font-variant-numeric:tabular-nums;font-size:14px;font-weight:800;color:var(--ink)}
  .playRow .resetBtn{display:none;margin:0;width:auto;height:40px;padding:0 16px;border-radius:999px;background:#3a2046;color:#fff;border:0;font-size:14px;font-weight:800;cursor:pointer}
  .playRow .resetBtn.show{display:block;animation:fadeIn .5s var(--out) both}
  .qProg{margin-bottom:12px}
  .qBar{height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
  .qFill{height:100%;width:0;background:#fff;border-radius:3px;transition:width .3s linear}
  .row{background:#fff;border-radius:26px;margin-bottom:8px;overflow:hidden;transition:background-color .4s var(--out)}
  .row.ok{background:#e9f8ee}
  .row.ng{background:#fdecea}
  .rowHead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;padding:13px 14px;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;text-align:left;transition:background-color .25s var(--out)}
  .rowHead:active:not(:disabled){background:#f6f0f9}
  .rowHead:disabled{cursor:default}
  .rl{font-size:13px;color:var(--sub);font-weight:700;flex-shrink:0}
  .rv{font-weight:800;text-align:right;color:var(--ink)}
  .rv.empty{color:#b9abc0;font-weight:700}
  .rowWrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--out)}
  .row.open .rowWrap{grid-template-rows:1fr}
  .rowInner{min-height:0;overflow:hidden}
  .rowOpts{display:grid;gap:6px;padding:0 10px 10px;max-height:300px;overflow-y:auto;opacity:0;filter:blur(4px);transform:translateY(-6px);transition:opacity .35s var(--out),filter .45s var(--out),transform .5s var(--out)}
  .row.open .rowOpts{opacity:1;filter:blur(0);transform:none;transition-delay:.05s}
  .opt{border:0;background:#f4eef7;border-radius:999px;padding:10px 12px;text-align:left;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;transition:background-color .25s var(--out),transform .25s var(--out)}
  .row.open .opt{animation:optIn .5s var(--out) both;animation-delay:calc(var(--i,0) * 40ms + 80ms)}
  @keyframes optIn{from{opacity:0;transform:translateY(-6px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
  .opt:active{transform:scale(.98);background:#ebdff1}
  .row[data-k="composer"] .rowOpts{grid-template-columns:1fr 1fr}
  .row[data-k="era"] .rowOpts{grid-template-columns:repeat(3,1fr)}
  .btn{display:block;width:100%;margin-top:12px;border:0;border-radius:999px;padding:13px 16px;font-size:15px;font-weight:800;cursor:pointer;background:#fff;color:var(--ink);transition:transform .25s var(--out),background-color .3s var(--out),color .3s var(--out)}
  .btn:active:not(:disabled){transform:scale(.98)}
  .btn:disabled{background:rgba(255,255,255,.14);color:rgba(255,255,255,.45);cursor:default}
  .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.28)}
  .btnRow{display:flex;gap:8px;margin-top:12px}
  .btnRow .btn{margin-top:0}
  .btnRow .btn.ghost{flex:1}
  .btnRow #mainBtn{flex:1;width:auto}
  .sRow{display:flex;gap:10px;align-items:flex-start;animation:fadeIn .5s var(--out) .15s both}
  .rePlay{flex-shrink:0;width:auto;height:40px;padding:0 16px;border-radius:999px;border:0;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .25s var(--out),background-color .3s var(--out),color .3s var(--out)}
  .rePlay:active{transform:scale(.98)}
  .rePlay svg{width:16px;height:16px}
  .rePlay .ic-pause{display:none}
  .rePlay.isPlaying{background:var(--accent);color:#fff}
  .rePlay.isPlaying .ic-play{display:none}
  .rePlay.isPlaying .ic-pause{display:block}
  .sList{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .sPill{display:flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:800;background:#fff;color:var(--ink)}
  .sLab{width:40px;flex-shrink:0;font-size:12px;color:var(--sub)}
  .sVals{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;white-space:normal}
  .sWrong{min-width:0;overflow-wrap:anywhere;text-decoration:line-through;text-decoration-thickness:2px;color:#c0392b}
  .sVal{min-width:0;overflow-wrap:anywhere}
  .sPill.ok .sVal{color:#2f9e44}
  .qRows{display:block}
  .score{text-align:center;padding:16px 0;color:#fff}
  .score .big{font-size:40px;font-weight:900}
  .wrongList{text-align:left;font-size:14px;margin-top:12px;color:#fff}
  .wrongList li{margin-bottom:6px}
  .pet{display:flex;justify-content:center;margin:20px 0 8px}
  .petImg{width:min(100%,260px);height:auto;border-radius:20px;border:0;display:block;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;will-change:transform}
  .pet{display:none}
  /* ================= PC 레이아웃 (넓은 화면) ================= */
  @media (min-width:900px){
    body{max-width:780px;padding:28px 24px 100px}
    .head{top:16px;padding:10px;border-radius:32px;margin-bottom:18px}
    .tabRow{margin-top:10px;gap:10px}
    .ytBtn{height:46px;font-size:17px}
    .ytBtn svg{width:24px;height:24px}
    .nav button{height:46px;padding:0 28px;font-size:16px}
    .navFrame{padding:5px}
    input[type=range]{height:46px}
    input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px}
    input[type=range]::-webkit-slider-thumb{width:18px;height:18px;margin-top:-5px}
    input[type=range]::-moz-range-thumb{width:18px;height:18px}
    .section.eraCard{padding:16px 14px;border-radius:40px;margin-bottom:18px}
    .section h2{font-size:16px;margin:4px 18px 14px}
    .track{border-radius:32px;margin-bottom:10px}
    .tHead{padding:16px 20px;gap:14px}
    .num{width:34px;height:34px}
    .num svg{width:15px;height:15px}
    .meta{font-size:17px}
    .pad{padding:0 20px 18px}
    .qcard{padding:16px;border-radius:42px;margin-bottom:18px}
    .qTitle{font-size:16px;margin:4px 18px 14px}
    .row{border-radius:30px;margin-bottom:10px}
    .rowHead{padding:16px 20px;font-size:16px}
    .rl{font-size:14px}
    .opt{padding:12px 18px;font-size:16px}
    .rowOpts{padding:0 14px 14px}
    .row[data-k="composer"] .rowOpts{grid-template-columns:repeat(3,1fr)}
    .btn{padding:16px 20px;font-size:16px}
    .playRow .btn.play,.rePlay{height:46px}
    .sPill{min-height:46px;padding:8px 18px;font-size:16px}
    .sLab{width:52px;font-size:13px}
  }
  /* ================= PC 전용 애니메이션 (마우스 사용 환경) ================= */
  @media (hover:hover) and (pointer:fine){
    body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
      background:radial-gradient(40% 40% at 20% 25%,rgba(255,196,228,.16),transparent 70%),
                 radial-gradient(45% 45% at 80% 70%,rgba(150,110,255,.16),transparent 70%);
      }
    .track{cursor:pointer;transition:box-shadow .5s var(--out),transform .45s var(--out)}
    .track:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(0,0,0,.3)}
    .track.open:hover{transform:none}
    .tHead:hover .num{transform:scale(1.12)}
    .tHead .meta{transition:transform .45s var(--out)}
    .tHead:hover .meta{transform:translateX(4px)}
    .bar{transition:height .3s var(--out)}
    .bar:hover{height:10px}
    .bar:hover .fill{box-shadow:0 0 10px rgba(34,0,43,.45)}
    .nav button:not(.on):hover{color:#fff;background:rgba(255,255,255,.12)}
    .nav button{cursor:pointer}
    .ytBtn{isolation:isolate;transition:transform .4s var(--out),box-shadow .5s var(--out)}
    .ytBtn:hover{box-shadow:0 10px 22px rgba(255,120,190,.4)}
    .btn,.playRow .btn.play,.rePlay{transition:transform .35s var(--out),box-shadow .45s var(--out),background-color .3s var(--out),color .3s var(--out)}
    .opt{transition:background-color .3s var(--out),transform .35s var(--out)}
    .rowHead{transition:background-color .3s var(--out)}
    .track{transition:transform .45s var(--out),box-shadow .5s var(--out)}
    .nav button{transition:color .4s var(--out),background-color .4s var(--out),transform .25s var(--out)}
    .ytBtn svg{transition:transform .5s var(--out)}
    .ytBtn:hover svg{transform:scale(1.2) rotate(-8deg)}
    /* PC 호버 버튼 스케일: ease-out 적용 */
    .rowHead:hover:not(:disabled){background:#f6f0f9}
    .opt:hover{background:#e9dcf0;transform:translateX(4px)}
    .row[data-k="composer"] .opt:hover,.row[data-k="era"] .opt:hover{transform:translateY(-2px)}
    .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.28);transition:transform .3s ease-out,box-shadow .3s ease-out,background-color .3s ease-out,color .3s ease-out}
    .btn.ghost:hover{background:rgba(255,255,255,.1)}
    .playRow .btn.play:hover,.rePlay:hover{transform:translateY(-2px);box-shadow:0 8px 16px rgba(0,0,0,.25);transition:transform .3s ease-out,box-shadow .3s ease-out,background-color .3s ease-out,color .3s ease-out}
    .playRow .resetBtn:hover{background:#4a2a58}
    input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.25);box-shadow:0 0 0 6px rgba(241,232,245,.18)}
    #listen.active .track{animation:riseSoft .7s var(--out) backwards;animation-delay:calc(var(--d,0) * 35ms + 120ms)}
    #listen.active .track:nth-child(n+2){--d:1}
    #listen.active .track:nth-child(n+3){--d:2}
    #listen.active .track:nth-child(n+4){--d:3}
    #listen.active .track:nth-child(n+5){--d:4}
    button:focus-visible,a:focus-visible{outline:2px solid #ffc4e4;outline-offset:2px}
  }
</style>
</head>
<body>
<header class="head">
  <a class="ytBtn" href="https://m.youtube.com/@neneko_mashiro" target="_blank" rel="noopener"><span>네네코 마시로 구독</span><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#ff0000" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8z"/><path fill="#ffffff" d="M9.6 15.6V8.4l6.2 3.6z"/></svg></a>
  <div class="tabRow">
    <div class="navFrame"><nav class="nav">
      <span class="pill" id="pill"></span>
      <button id="tabListen" class="on">듣기</button>
      <button id="tabQuiz">시험</button>
    </nav></div>
    <div class="volRow"><input type="range" id="vol" min="0" max="1" step="0.01" value="0.5" aria-label="음량"></div>
  </div>
</header>
<div class="stage">
  <!-- 듣기 -->
  <section id="listen" class="screen active">
    <div id="list"></div>
  </section>
  <!-- 시험 -->
  <section id="quiz" class="screen">
    <div id="quizList"></div>
  <!-- ▼▼ 펫 이미지: 아래 img 한 줄을, 원본 파일의 <img class="petImg" ... src="data:image/jpeg;base64,/9j/..."> 줄로 그대로 교체하세요 ▼▼ -->
  <div class="pet"><img class="petImg" alt="" src="https://via.placeholder.com/260x180"></div>
  </section>
</div>
<audio id="audio" preload="metadata"></audio>
<script>
/* 음원: HTML과 같은 위치의 audio 폴더 (1.mp3 ~ 13.mp3) */
function srcFor(n) {
  return `audio/${n}.mp3`;
}
const TRACKS = [
  { n:1,  composer:"베를리오즈", title:"환상 교향곡 중 제2악장 '무도회'", era:"낭만" },
  { n:2,  composer:"쇼팽",       title:"환상 즉흥곡",                     era:"낭만" },
  { n:3,  composer:"브람스",     title:"헝가리 무곡 5번",                 era:"낭만" },
  { n:4,  composer:"스메타나",   title:"나의 조국 중 제2곡 '몰다우'",      era:"국민악파" },
  { n:5,  composer:"그리그",     title:"페르 귄트 모음곡 중 '아침의 기분'", era:"국민악파" },
  { n:6,  composer:"그리그",     title:"페르 귄트 모음곡 중 '산 왕의 궁전에서'", era:"국민악파" },
  { n:7,  composer:"그리그",     title:"페르 귄트 모음곡 중 '솔베이그의 노래'", era:"국민악파" },
  { n:8,  composer:"드뷔시",     title:"목신의 오후 전주곡",              era:"근현대" },
  { n:9,  composer:"드뷔시",     title:"바다 중 제2악장 '파도의 희롱'",    era:"근현대" },
  { n:10, composer:"드뷔시",     title:"달빛",                           era:"근현대" },
  { n:11, composer:"쇤베르크",   title:"피아노 모음곡 제25번 전주곡",      era:"근현대" },
  { n:12, composer:"쇤베르크",   title:"달에 홀린 피에로 중 제1곡 '달에 취하여'", era:"근현대" },
  { n:13, composer:"스트라빈스키", title:"봄의 제전",                      era:"근현대" }
];
const COMPOSERS = [...new Set(TRACKS.map(t => t.composer))];
const ERAS = ["낭만", "국민악파", "근현대"];
const pad = n => String(n).padStart(2, "0");
const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);
const fmt = s => (isFinite(s) && s >= 0) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}` : "0:00";
const $ = (el, sel) => el.querySelector(sel);
/* ---------- 듣기: 카드 안에서 플레이어가 펼쳐짐 ---------- */
const list = document.getElementById("list");
const audio = document.getElementById("audio");
let cur = null; // 지금 펼쳐진 곡 카드
function renderList() {
  list.innerHTML = ERAS.map(era => `
    <div class="section eraCard">
      <h2>${era}</h2>
      ${TRACKS.filter(t => t.era === era).map(t => `
        <div class="track" data-n="${t.n}">
          <div class="tHead">
            <div class="num"><span class="n">${t.n}</span><svg class="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><svg class="iconPause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></div>
            <div class="meta">${t.composer} - ${t.title}</div>
            <div class="eq"><i></i><i></i><i></i></div><div class="spin"></div>
          </div>
          <div class="tBody"><div class="tInner"><div class="pad">
            <div class="pBar">
              <div class="bar"><div class="fill"></div></div>
              <div class="pTimes"><span class="pCur">0:00</span><span class="pDur">0:00</span></div>
            </div>
            <div class="missWrap"><div class="missing">음원을 재생할 수 없어요. 다른 브라우저(Chrome, Safari)로 열어 보세요.</div></div>
          </div></div></div>
        </div>`).join("")}
    </div>`).join("");
}
function setProgress(el, pct) {
  $(el, ".fill").style.width = Math.max(0, Math.min(100, pct)) + "%";
}
function resetCard(el) {
  setProgress(el, 0);
  $(el, ".pCur").textContent = "0:00";
  $(el, ".pDur").textContent = "0:00";
  $(el, ".missWrap").classList.remove("show");
}
function closeCard(el) {
  el.classList.remove("open", "isPlaying");
  setTimeout(() => { if (!el.classList.contains("open")) resetCard(el); }, 450);
}
function openCard(el) {
  if (cur && cur !== el) closeCard(cur);
  cur = el;
  el.classList.add("open");
  const n = +el.dataset.n;
  resetCard(el);
  document.querySelectorAll(".track.loading").forEach(t => t.classList.remove("loading"));
  el.classList.remove("isPlaying");
  el.classList.add("loading");
  audio.src = srcFor(n);
  audio.play().catch(() => {});
  setTimeout(() => el.scrollIntoView({ behavior:"smooth", block:"nearest" }), 380);
}
list.addEventListener("click", e => {
  const head = e.target.closest(".tHead");
  if (head) {
    const el = head.parentElement;
    if (e.target.closest(".num") && el === cur && el.classList.contains("open")) {
      if (audio.paused) { rewindIfEnded(audio); audio.play().catch(() => {}); } else audio.pause();
      return;
    }
    if (el === cur && el.classList.contains("open")) {
      audio.pause();
      closeCard(el);
      cur = null;
    } else {
      openCard(el);
    }
    return;
  }
});
let dragging = null;
function seekFromEvent(e) {
  const d = clipLen(audio);
  if (!dragging || !audio.duration || !cur) return;
  const r = dragging.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  audio.currentTime = pct * d;
  setProgress(cur, pct * 100);
  $(cur, ".pCur").textContent = fmt(audio.currentTime);
}
list.addEventListener("pointerdown", e => {
  const bar = e.target.closest(".bar");
  if (!bar || !cur || !cur.contains(bar)) return;
  dragging = bar;
  bar.classList.add("drag");
  bar.setPointerCapture(e.pointerId);
  seekFromEvent(e);
});
list.addEventListener("pointermove", e => { if (dragging) seekFromEvent(e); });
function endDrag() { if (dragging) { dragging.classList.remove("drag"); dragging = null; } }
list.addEventListener("pointerup", endDrag);
list.addEventListener("pointercancel", endDrag);
audio.addEventListener("loadstart", () => cur && cur.classList.add("loading"));
audio.addEventListener("waiting", () => cur && cur.classList.add("loading"));
audio.addEventListener("playing", () => { if (!cur) return; cur.classList.remove("loading"); cur.classList.add("isPlaying"); });
audio.addEventListener("pause", () => { if (!cur) return; cur.classList.remove("loading", "isPlaying"); });
audio.addEventListener("ended", () => { if (!cur) return; cur.classList.remove("loading", "isPlaying"); });
audio.addEventListener("error", () => { if (!cur) return; cur.classList.remove("loading", "isPlaying"); });
audio.addEventListener("loadedmetadata", () => { if (cur) $(cur, ".pDur").textContent = fmt(clipLen(audio)); });
audio.addEventListener("timeupdate", () => {
  if (!cur) return;
  const d = clipLen(audio);
  const pct = d ? (audio.currentTime / d) * 100 : 0;
  if (!dragging) setProgress(cur, pct);
  $(cur, ".pCur").textContent = fmt(audio.currentTime);
});
audio.addEventListener("error", () => {
  if (!cur || !audio.getAttribute("src")) return;
  const n = +cur.dataset.n;
  $(cur, ".missWrap").classList.add("show");
});
/* ---------- 시험 ---------- */
const quizList = document.getElementById("quizList");
const quizAudio = new Audio();
const replayAudio = new Audio();
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
let clipStarted = false;
let replayBtnCur = null;
const FIELDS = [["composer", "작곡가"], ["title", "제목"], ["era", "시대"]];
let deck = [], lastN = null, score = 0, wrongs = [], qNo = 0, asked = 0, scoreCard = null;
let curTrack, opts, correct, answers, activeCard, busy = false;
function startQuiz() {
  replayAudio.pause();
  deck = []; lastN = null; score = 0; wrongs = []; qNo = 0; asked = 0; scoreCard = null;
  quizList.innerHTML = "";
  nextTrack();
}
function nextFromDeck() {
  if (!deck.length) {
    deck = shuffle(TRACKS);
    if (lastN !== null && deck[0].n === lastN) {
      [deck[0], deck[deck.length - 1]] = [deck[deck.length - 1], deck[0]];
    }
  }
  lastN = deck[0].n;
  return deck.shift();
}
function makeOptions() {
  return {
    composer: COMPOSERS,
    title:    TRACKS.map(x => x.title),
    era:      ERAS
  };
}
function allAnswered() {
  return FIELDS.every(([k]) => answers[k] !== null);
}
function activeHTML() {
  return `
    <div class="qTitle">문제 ${qNo}</div>
    <div class="playRow">
      <button class="btn play" id="playBtn"><span class="eq2"><i></i><i></i><i></i></span><span class="pl"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span><span class="qCurTxt" id="qCur">0:00</span></button>
      <button class="resetBtn" id="resetBtn">초기화</button>
    </div>
    <div class="qProg">
      <div class="qBar"><div class="qFill" id="qFill"></div></div>
    </div>
    <div class="qRows">${FIELDS.map(([k, label]) => `
      <div class="row" data-k="${k}">
        <button class="rowHead" data-k="${k}">
          <span class="rl">${k === "title" ? "곡 이름" : label}</span>
          <span class="rv empty">선택하기</span>
        </button>
        <div class="rowWrap"><div class="rowInner"><div class="rowOpts">
          ${opts[k].map((o, i) => `<button class="opt" style="--i:${i}" data-v="${o}">${o}</button>`).join("")}
        </div></div></div>
      </div>`).join("")}</div>
    <div class="btnRow">
      <button class="btn" id="mainBtn" disabled>확인</button>
    </div>`;
}
function nextTrack() {
  curTrack = nextFromDeck();
  qNo++;
  opts = makeOptions();
  correct = { composer: curTrack.composer, title: curTrack.title, era: curTrack.era };
  answers = { composer: null, title: null, era: null };
  busy = false;
  dropPet();
  activeCard = document.createElement("div");
  activeCard.className = "qcard anim";
  activeCard.innerHTML = activeHTML();
  quizList.appendChild(activeCard);
  activeCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
  loadClip();
}
function updateMain() {
  const b = activeCard && activeCard.querySelector("#mainBtn");
  if (b) b.disabled = !allAnswered();
}
function summaryHTML() {
  const rows = FIELDS.map(([k, label]) => {
    const ok = answers[k] === correct[k];
    const vals = ok
      ? `<span class="sVal">${correct[k]}</span>`
      : `<span class="sWrong">${answers[k]}</span><span class="sVal">${correct[k]}</span>`;
    return `<div class="sPill ${ok ? "ok" : "ng"}"><span class="sLab">${label}</span><span class="sVals">${vals}</span></div>`;
  }).join("");
  return `<div class="sRow">
    <button class="rePlay" data-n="${curTrack.n}" aria-label="다시 듣기">
      <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <div class="sList">${rows}</div>
  </div>`;
}
function collapse(card, html, after) {
  const h1 = card.offsetHeight;
  card.classList.remove("anim");
  card.innerHTML = html;
  card.classList.add("done");
  card.style.height = "auto";
  const h2 = card.offsetHeight;
  card.style.height = h1 + "px";
  void card.offsetHeight;
  card.style.transition = "height .55s cubic-bezier(.2,.8,.2,1)";
  card.style.height = h2 + "px";
  setTimeout(() => {
    card.style.transition = "";
    card.style.height = "";
    after();
  }, 600);
}
function submit() {
  if (busy || !allAnswered()) return;
  busy = true;
  const card = activeCard;
  activeCard = null;
  FIELDS.forEach(([k, label]) => {
    if (answers[k] === correct[k]) score++;
    else wrongs.push(`${curTrack.composer} - ${curTrack.title} (${label}: 정답 ${correct[k]})`);
  });
  asked++;
  quizAudio.pause();
  collapse(card, summaryHTML(), nextTrack);
}
function loadClip() {
  quizAudio.pause();
  replayAudio.pause();
  quizAudio.src = srcFor(curTrack.n);
  quizAudio.currentTime = 0;
  clipStarted = false;
}
function setReplayIcon(btn, playing) {
  if (btn) btn.classList.toggle("isPlaying", playing);
}
function replayClip(btn, n) {
  if (replayBtnCur === btn && !replayAudio.paused) { replayAudio.pause(); return; }
  if (replayBtnCur && replayBtnCur !== btn) setReplayIcon(replayBtnCur, false);
  quizAudio.pause();
  replayBtnCur = btn;
  replayAudio.src = srcFor(n);
  replayAudio.currentTime = 0;
  replayAudio.play().catch(() => {});
  setReplayIcon(btn, true);
}
["pause", "ended"].forEach(ev => replayAudio.addEventListener(ev, () => setReplayIcon(replayBtnCur, false)));
function togglePlay() {
  replayAudio.pause();
  if (quizAudio.paused) {
    rewindIfEnded(quizAudio);
    quizAudio.play().catch(() => {});
  } else {
    quizAudio.pause();
  }
}
function syncPlay() {
  const b = document.getElementById("playBtn");
  if (!b) return;
  const playing = !quizAudio.paused;
  const label = playing ? ICON_PAUSE : ICON_PLAY;
  b.classList.toggle("isPlaying", playing);
  b.querySelector(".pl").innerHTML = label;
  const reset = document.getElementById("resetBtn");
  if (reset) {
    const show = clipStarted;
    if (show && !reset.classList.contains("show")) reset.classList.add("show");
    if (!show) reset.classList.remove("show");
  }
  updateQProg();
}
function updateQProg() {
  const fill = document.getElementById("qFill");
  if (!fill) return;
  const d = clipLen(quizAudio);
  const cur = document.getElementById("qCur");
  const dur = document.getElementById("qDur");
  fill.style.width = Math.min(100, (quizAudio.currentTime / d) * 100) + "%";
  if (cur) cur.textContent = fmt(quizAudio.currentTime);
  if (dur) dur.textContent = fmt(d);
}
function resetClip() {
  clipStarted = false;
  quizAudio.pause();
  quizAudio.currentTime = 0;
  syncPlay();
}
quizAudio.addEventListener("play", () => { clipStarted = true; });
["play", "pause", "ended", "loadstart", "timeupdate", "loadedmetadata"].forEach(ev => quizAudio.addEventListener(ev, syncPlay));
function showScore() {
  quizAudio.pause();
  replayAudio.pause();
  if (scoreCard) scoreCard.remove();
  const total = asked * 3;
  const el = document.createElement("div");
  el.className = "qcard enter";
  scoreCard = el;
  el.innerHTML = asked === 0
    ? `<div class="score">아직 푼 문제가 없어요</div>`
    : `<div class="score"><div>점수</div><div class="big">${score} / ${total}</div></div>
       ${wrongs.length
         ? `<div class="wrongList"><b>틀린 문항</b><ul>${wrongs.map(w => `<li>${w}</li>`).join("")}</ul></div>`
         : `<div class="score">모두 맞혔어요!</div>`}`;
  el.insertAdjacentHTML("beforeend", `<button class="btn" id="restart">다시 풀기</button>`);
  quizList.appendChild(el);
  el.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
quizList.addEventListener("click", e => {
  if (e.target.closest("#playBtn")) return togglePlay();
  if (e.target.closest("#resetBtn")) return resetClip();
  const rp = e.target.closest(".rePlay");
  if (rp) return replayClip(rp, +rp.dataset.n);
  if (e.target.closest("#restart")) return startQuiz();
  if (!activeCard || !activeCard.contains(e.target)) return;
  if (e.target.closest("#mainBtn")) return submit();
  const head = e.target.closest(".rowHead");
  if (head) {
    const row = head.closest(".row");
    const willOpen = !row.classList.contains("open");
    row.classList.toggle("open", willOpen);
    return;
  }
  const opt = e.target.closest(".opt");
  if (opt) {
    const row = opt.closest(".row");
    const k = row.dataset.k;
    answers[k] = opt.dataset.v;
    const rv = row.querySelector(".rv");
    rv.textContent = opt.dataset.v;
    rv.classList.remove("empty");
    row.classList.remove("open");
    updateMain();
  }
});
/* ---------- 탭 ---------- */
const tabListen = document.getElementById("tabListen");
const tabQuiz = document.getElementById("tabQuiz");
const listenEl = document.getElementById("listen");
const quizEl = document.getElementById("quiz");
const pill = document.getElementById("pill");
function movePill() {
  const b = document.querySelector(".nav button.on");
  pill.style.left = b.offsetLeft + "px";
  pill.style.width = b.offsetWidth + "px";
}
function show(which) {
  const toQuiz = which === "quiz";
  if (toQuiz === quizEl.classList.contains("active")) return;
  listenEl.classList.toggle("active", !toQuiz);
  quizEl.classList.toggle("active", toQuiz);
  tabListen.classList.toggle("on", !toQuiz);
  tabQuiz.classList.toggle("on", toQuiz);
  movePill();
  window.scrollTo(0, 0);
  if (toQuiz) { audio.pause(); startQuiz(); }
  else { quizAudio.pause(); replayAudio.pause(); }
}
tabListen.onclick = () => show("listen");
tabQuiz.onclick = () => show("quiz");
window.addEventListener("resize", movePill);
document.querySelector(".ytBtn").style.setProperty("--pet", `url(${document.querySelector(".petImg").src})`);
renderList();
movePill();
(function () {
  const img = document.querySelector(".petImg");
  if (!img) return;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const newTarget = () => ({ ay: rnd(2.5, 5), ax: rnd(0.8, 2), ar: rnd(0.3, 0.9), w: rnd(0.9, 1.5) });
  let cur = newTarget(), tgt = newTarget();
  const phase = Math.random() * Math.PI * 2;
  let t = 0, last = performance.now(), nextPick = last + rnd(3000, 6000);
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now; t += dt;
    if (now > nextPick) { tgt = newTarget(); nextPick = now + rnd(3000, 6000); }
    const k = 1 - Math.exp(-dt * 0.8);
    for (const key of ["ay", "ax", "ar", "w"]) cur[key] += (tgt[key] - cur[key]) * k;
    const y = cur.ay * Math.sin(cur.w * t + phase);
    const x = cur.ax * Math.sin(cur.w * 0.6 * t + phase * 1.7);
    const r = cur.ar * Math.sin(cur.w * 0.8 * t + phase * 0.5);
    img.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) rotate(${r.toFixed(2)}deg)`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
function dropPet() {
  const el = document.querySelector(".pet");
  if (!el || !el.animate) return;
  el.animate([
    { transform: "translateY(-40px)", opacity: 0, filter: "blur(8px)" },
    { transform: "translateY(0)", opacity: 1, filter: "blur(0)" }
  ], { duration: 800, easing: "cubic-bezier(.22,1,.36,1)" });
}
(function () {
  const img = document.querySelector(".petImg");
  if (!img || !img.animate) return;
  const ease = "cubic-bezier(.22,1,.36,1)";
  let pressed = false;
  img.addEventListener("pointerdown", () => {
    pressed = true;
    img.getAnimations().forEach(a => a.cancel());
    img.animate([{ scale: "1" }, { scale: ".96" }], { duration: 350, easing: ease, fill: "forwards" });
  });
  const up = () => {
    if (!pressed) return;
    pressed = false;
    img.getAnimations().forEach(a => a.cancel());
    img.animate([{ scale: ".96" }, { scale: "1" }], { duration: 500, easing: ease });
  };
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => img.addEventListener(ev, up));
  img.addEventListener("contextmenu", e => e.preventDefault());
  img.addEventListener("dragstart", e => e.preventDefault());
})();
const CLIP = 25;
function clipLen(a) { return Math.min(a.duration || CLIP, CLIP); }
function enforceClip(a) { if (a.currentTime >= CLIP) { a.pause(); a.currentTime = CLIP; } }
function rewindIfEnded(a) { if (a.currentTime >= CLIP - 0.2) a.currentTime = 0; }
[audio, quizAudio, replayAudio].forEach(a => a.addEventListener("timeupdate", () => enforceClip(a)));
const volInput = document.getElementById("vol");
function paintVol() { volInput.style.setProperty("--p", (volInput.value * 100) + "%"); }
function applyVol() { audio.volume = quizAudio.volume = replayAudio.volume = +volInput.value; }
paintVol();
applyVol();
volInput.addEventListener("input", () => { paintVol(); applyVol(); });
function setBarVars() {
  const bar = document.querySelector(".topbar");
  if (bar) document.documentElement.style.setProperty("--bar-h", bar.offsetHeight + "px");
}
setBarVars();
window.addEventListener("resize", setBarVars);
document.fonts && document.fonts.ready.then(setBarVars);
</script>
